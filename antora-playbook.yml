runtime:
  cache_dir: ./.cache/antora
  log:
    failure_level: warn
site:
  title: SOGo 6 docs
  start_page: SOGo6-Home::index.adoc
  robots: allow
content:
  # "Edit this Page" links go to the file on GitHub, on the branch being built.
  # The default UI only uses it when CI=true; local builds link to the local file instead.
  edit_url: https://github.com/Alinto/SOGo6-docs/edit/{refname}/{path}
  # Local build: reads the checked-out branch, uncommitted changes included
  sources:
  - url: .
    branches: HEAD
    start_path: developer
  - url: .
    branches: HEAD
    start_path: admin
  - url: .
    branches: HEAD
    start_path: landing
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: supplemental-ui
output:
  dir: build
